<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Core 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #03050a;
            color: #ffaa00;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 170, 0, 0.3);
            padding-bottom: 10px;
            z-index: 10;
        }

        .title {
            font-size: 1rem;
            letter-spacing: 3px;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 170, 0, 0.8);
        }

        .status {
            font-size: 0.85rem;
            color: #ffaa00;
            letter-spacing: 1px;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-container {
            z-index: 10;
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 10px;
        }

        .console {
            background: rgba(8, 5, 2, 0.8);
            border: 1px solid rgba(255, 170, 0, 0.4);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.15);
        }

        .response {
            font-size: 1rem;
            color: #ffe4b3;
            text-shadow: 0 0 8px rgba(255, 170, 0, 0.6);
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            background: rgba(15, 10, 3, 0.85);
            border: 1px solid rgba(255, 170, 0, 0.5);
            padding: 12px;
            border-radius: 6px;
            color: #ffaa00;
            outline: none;
            font-size: 1rem;
        }

        input:focus {
            border-color: #ffaa00;
            box-shadow: 0 0 12px rgba(255, 170, 0, 0.4);
        }

        button {
            background: rgba(255, 170, 0, 0.2);
            border: 1px solid #ffaa00;
            color: #ffaa00;
            padding: 12px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        button:hover {
            background: #ffaa00;
            color: #03050a;
            box-shadow: 0 0 15px #ffaa00;
        }

        .mic-btn {
            background: rgba(255, 80, 0, 0.25);
            border-color: #ff5500;
            color: #ffaa00;
        }
    </style>
    <!-- Librería Three.js para motor 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <header>
        <div class="title">J.A.R.V.I.S. // HOLOGRAM_CORE</div>
        <div class="status" id="status">SISTEMA CONECTADO</div>
    </header>

    <div id="canvas-container"></div>

    <div class="ui-container">
        <div class="console">
            <div class="response" id="responseText">Sistemas listos. Toca 'HABLAR' o escribe tu orden.</div>
        </div>
        <div class="controls">
            <button class="mic-btn" onclick="startListening()">🎤 HABLAR</button>
            <input type="text" id="userInput" placeholder="Escribir comando..." onkeypress="checkEnter(event)">
            <button onclick="sendCommand()">ENVIAR</button>
        </div>
    </div>

    <script>
        // Escena 3D estilo Película
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const coreGroup = new THREE.Group();
        scene.add(coreGroup);

        // 1. Núcleo Interno
        const innerGeo = new THREE.IcosahedronGeometry(2, 3);
        const innerMat = new THREE.MeshBasicMaterial({
            color: 0xffaa00,
            wireframe: true,
            transparent: true,
            opacity: 0.45
        });
        const innerSphere = new THREE.Mesh(innerGeo, innerMat);
        coreGroup.add(innerSphere);

        // 2. Capa Externa
        const outerGeo = new THREE.IcosahedronGeometry(2.8, 2);
        const outerMat = new THREE.MeshBasicMaterial({
            color: 0xff6600,
            wireframe: true,
            transparent: true,
            opacity: 0.25
        });
        const outerSphere = new THREE.Mesh(outerGeo, outerMat);
        coreGroup.add(outerSphere);

        // 3. Nube de Partículas
        const particleCount = 2500;
        const particleGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount; i++) {
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const r = 2.0 + (Math.random() * 1.2);

            positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
            positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
            positions[i * 3 + 2] = r * Math.cos(phi);
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particleMat = new THREE.PointsMaterial({
            color: 0xffc800,
            size: 0.045,
            transparent: true,
            opacity: 0.8
        });
        const particles = new THREE.Points(particleGeo, particleMat);
        coreGroup.add(particles);

        // 4. Anillo Orbital
        const ringGeo = new THREE.TorusGeometry(3.3, 0.012, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.6 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 3;
        coreGroup.add(ring);

        camera.position.z = 6.5;

        // Bucle de Animación
        function animate() {
            requestAnimationFrame(animate);
            innerSphere.rotation.y += 0.006;
            innerSphere.rotation.x += 0.003;
            outerSphere.rotation.y -= 0.004;
            particles.rotation.y += 0.002;
            ring.rotation.z += 0.008;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Lógica de Reconocimiento de Voz
        const statusEl = document.getElementById('status');
        const responseTextEl = document.getElementById('responseText');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';

            recognition.onstart = () => {
                statusEl.innerText = "ESCUCHANDO...";
                innerMat.color.setHex(0xff2200);
                particleMat.color.setHex(0xff3300);
            };

            recognition.onresult = (e) => {
                processCommand(e.results[0][0].transcript);
            };

            recognition.onerror = () => {
                statusEl.innerText = "ENTRADA DE TEXTO ACTIVA";
                responseTextEl.innerText = "Escribe tu comando en el campo inferior.";
                resetColors();
            };

            recognition.onend = () => {
                resetColors();
            };
        }

        function resetColors() {
            if (statusEl.innerText === "ESCUCHANDO...") statusEl.innerText = "SISTEMA CONECTADO";
            innerMat.color.setHex(0xffaa00);
            particleMat.color.setHex(0xffc800);
        }

        function startListening() {
            window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));
            if (recognition) {
                try {
                    recognition.start();
                } catch (err) {
                    recognition.stop();
                }
            } else {
                responseTextEl.innerText = "Modo de texto activo. Escribe tu comando.";
            }
        }

        function checkEnter(e) {
            if (e.key === 'Enter') sendCommand();
        }

        function sendCommand() {
            const input = document.getElementById('userInput');
            if (input.value.trim() !== '') {
                processCommand(input.value);
                input.value = '';
            }
        }

        // Conexión con funciones del móvil
        function processCommand(text) {
            statusEl.innerText = "PROCESANDO...";
            const lower = text.toLowerCase();
            let reply = "No tengo registros para esa instrucción, Señor.";

            if (lower.includes("hola") || lower.includes("saludos")) {
                reply = "A sus órdenes, Señor. Proyección holográfica activa.";
            } else if (lower.includes("estado") || lower.includes("sistemas")) {
                reply = "Todos los núcleos están operando con total estabilidad.";
            } else if (lower.includes("hora")) {
                const now = new Date();
                reply = `Son las ${now.getHours()} horas con ${now.getMinutes()} minutos.`;
            } else if (lower.includes("spotify") || lower.includes("música") || lower.includes("musica")) {
                reply = "Abriendo Spotify en el dispositivo...";
                window.location.href = "spotify://";
            } else if (lower.includes("whatsapp") || lower.includes("mensaje")) {
                reply = "Abriendo WhatsApp...";
                window.location.href = "whatsapp://";
            } else if (lower.includes("teléfono") || lower.includes("telefono") || lower.includes("llamar")) {
                reply = "Abriendo aplicación de teléfono...";
                window.location.href = "tel:";
            }

            responseTextEl.innerText = reply;
            speak(reply);
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-ES';
            utterance.pitch = 0.85;

            utterance.onstart = () => {
                statusEl.innerText = "HABLANDO...";
            };

            utterance.onend = () => {
                statusEl.innerText = "SISTEMA CONECTADO";
            };

            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
