<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S. Core Hyper-AI 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #020408;
            color: #ffaa00;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            overflow: hidden;
            position: relative;
        }

        /* Scanline HUD effect */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), 
                        linear-gradient(90deg, rgba(255, 170, 0, 0.02), rgba(0, 240, 255, 0.01), rgba(255, 0, 0, 0.02));
            z-index: 5;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        header {
            width: 100%;
            max-width: 700px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 170, 0, 0.4);
            z-index: 10;
            background: rgba(4, 8, 16, 0.75);
            backdrop-filter: blur(12px);
            padding: 12px 18px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.15);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .arc-dot {
            width: 10px;
            height: 10px;
            background: #00f0ff;
            border-radius: 50%;
            box-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff;
            animation: pulseDot 2s infinite alternate;
        }

        @keyframes pulseDot {
            0% { transform: scale(0.8); opacity: 0.6; }
            100% { transform: scale(1.3); opacity: 1; }
        }

        .title {
            font-size: 0.9rem;
            letter-spacing: 2px;
            font-weight: 800;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 170, 0, 0.8);
            color: #ffc800;
        }

        .status-badge {
            font-size: 0.75rem;
            color: #00f0ff;
            letter-spacing: 1px;
            font-weight: 600;
            border: 1px solid rgba(0, 240, 255, 0.4);
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(0, 240, 255, 0.1);
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .hud-stats {
            position: absolute;
            top: 75px;
            left: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.68rem;
            letter-spacing: 1.5px;
            color: rgba(255, 170, 0, 0.7);
            pointer-events: none;
        }

        .hud-stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hud-stat-item::before {
            content: "►";
            font-size: 0.6rem;
            color: #00f0ff;
        }

        .ui-container {
            z-index: 10;
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 10px;
        }

        .console {
            background: rgba(5, 10, 20, 0.88);
            border: 1px solid rgba(255, 170, 0, 0.5);
            border-radius: 12px;
            padding: 16px 20px;
            text-align: center;
            backdrop-filter: blur(14px);
            box-shadow: 0 0 25px rgba(255, 170, 0, 0.2), inset 0 0 15px rgba(255, 170, 0, 0.05);
            position: relative;
            overflow: hidden;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .console::before, .console::after {
            content: "";
            position: absolute;
            width: 10px;
            height: 10px;
            border-color: #00f0ff;
            border-style: solid;
        }
        .console::before { top: 4px; left: 4px; border-width: 2px 0 0 2px; }
        .console::after { bottom: 4px; right: 4px; border-width: 0 2px 2px 0; }

        .response {
            font-size: 0.98rem;
            line-height: 1.4;
            color: #ffe8b3;
            text-shadow: 0 0 10px rgba(255, 170, 0, 0.7);
            min-height: 48px;
            max-height: 150px;
            overflow-y: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-word;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            background: rgba(8, 16, 28, 0.85);
            border: 1px solid rgba(255, 170, 0, 0.4);
            padding: 14px;
            border-radius: 8px;
            color: #ffaa00;
            outline: none;
            font-size: 0.95rem;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            color: #ffffff;
        }

        button {
            background: rgba(255, 170, 0, 0.15);
            border: 1px solid #ffaa00;
            color: #ffaa00;
            padding: 14px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        button:active, button:hover {
            background: #ffaa00;
            color: #020408;
            box-shadow: 0 0 20px #ffaa00;
            transform: translateY(-1px);
        }

        .mic-btn {
            background: rgba(255, 60, 0, 0.25);
            border-color: #ff3300;
            color: #ffaa00;
            box-shadow: 0 0 12px rgba(255, 51, 0, 0.2);
        }

        .mic-btn:active, .mic-btn:hover {
            background: #ff3300;
            color: #ffffff;
            box-shadow: 0 0 25px #ff3300;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <header>
        <div class="brand">
            <div class="arc-dot"></div>
            <div class="title">J.A.R.V.I.S. // HYPER-AI ENGINE</div>
        </div>
        <div class="status-badge" id="status">SISTEMA ONLINE</div>
    </header>

    <div class="hud-stats">
        <div class="hud-stat-item">CORE TEMP: 32°C</div>
        <div class="hud-stat-item">AI MODEL: OPEN-ROUTER DEEP-THINK</div>
        <div class="hud-stat-item">LATENCY: LOW</div>
    </div>

    <div id="canvas-container"></div>

    <div class="ui-container">
        <div class="console" id="consoleBox">
            <div class="response" id="responseText">Sistemas hiper-avanzados en línea. ¿En qué puedo asistirlo hoy, Señor?</div>
        </div>
        <div class="controls">
            <button class="mic-btn" onclick="startListening()">🎤 HABLAR</button>
            <input type="text" id="userInput" placeholder="Pregunta lo que quieras a la IA..." onkeypress="checkEnter(event)">
            <button onclick="sendCommand()">ENVIAR</button>
        </div>
    </div>

    <script>
        // --- Sintetizador de Sonidos Tácticos ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playBeep(freq = 800, type = 'sine', duration = 0.08) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playJarvisSound() {
            playBeep(520, 'sine', 0.06);
            setTimeout(() => playBeep(880, 'sine', 0.1), 70);
            setTimeout(() => playBeep(1200, 'sine', 0.08), 150);
        }

        // --- Escena 3D Arc Reactor ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const reactorGroup = new THREE.Group();
        scene.add(reactorGroup);

        const coreGeo = new THREE.IcosahedronGeometry(1.6, 3);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, wireframe: true, transparent: true, opacity: 0.6 });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        reactorGroup.add(coreMesh);

        const ring1Geo = new THREE.TorusGeometry(2.4, 0.025, 16, 100);
        const ring1Mat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.8 });
        const ring1 = new THREE.Mesh(ring1Geo, ring1Mat);
        ring1.rotation.x = Math.PI / 3;
        reactorGroup.add(ring1);

        const ring2Geo = new THREE.TorusGeometry(3.0, 0.02, 16, 100);
        const ring2Mat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.6 });
        const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
        ring2.rotation.y = Math.PI / 4;
        reactorGroup.add(ring2);

        const particleCount = 2200;
        const particleGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount; i++) {
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const r = 2.0 + (Math.random() * 1.5);

            positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
            positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
            positions[i * 3 + 2] = r * Math.cos(phi);
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particleMat = new THREE.PointsMaterial({ color: 0xffc800, size: 0.04, transparent: true, opacity: 0.75 });
        const particleSystem = new THREE.Points(particleGeo, particleMat);
        reactorGroup.add(particleSystem);

        camera.position.z = 6.8;
        let rotationSpeed = 0.005;

        function animate() {
            requestAnimationFrame(animate);
            coreMesh.rotation.y += rotationSpeed * 1.2;
            coreMesh.rotation.x += rotationSpeed * 0.6;
            ring1.rotation.z += rotationSpeed * 1.5;
            ring2.rotation.x -= rotationSpeed * 1.1;
            particleSystem.rotation.y += rotationSpeed * 0.5;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Reconocimiento de Voz ---
        const statusEl = document.getElementById('status');
        const responseTextEl = document.getElementById('responseText');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';

            recognition.onstart = () => {
                playJarvisSound();
                statusEl.innerText = "ESCUCHANDO...";
                statusEl.style.color = "#ff3300";
                coreMat.color.setHex(0xff2200);
                ring1Mat.color.setHex(0xff3300);
                rotationSpeed = 0.02;
            };

            recognition.onresult = (e) => {
                processCommand(e.results[0][0].transcript);
            };

            recognition.onerror = () => resetVisuals();
            recognition.onend = () => resetVisuals();
        }

        function resetVisuals() {
            statusEl.innerText = "SISTEMA ONLINE";
            statusEl.style.color = "#00f0ff";
            coreMat.color.setHex(0xffaa00);
            ring1Mat.color.setHex(0x00f0ff);
            rotationSpeed = 0.005;
        }

        function setThinkingVisuals() {
            statusEl.innerText = "PROCESANDO HIPER-IA...";
            statusEl.style.color = "#00f0ff";
            coreMat.color.setHex(0x00f0ff);
            particleMat.color.setHex(0x00f0ff);
            rotationSpeed = 0.018;
        }

        function startListening() {
            window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));
            if (recognition) {
                try { recognition.start(); } catch (err) { recognition.stop(); }
            } else {
                responseTextEl.innerText = "Escribe tu comando o pregunta.";
            }
        }

        function checkEnter(e) {
            if (e.key === 'Enter') sendCommand();
        }

        function sendCommand() {
            const input = document.getElementById('userInput');
            if (input.value.trim() !== '') {
                playBeep(900, 'sine', 0.05);
                processCommand(input.value);
                input.value = '';
            }
        }

        // --- Módulos Directos & Motor Hiper-IA ---
        async function processCommand(text) {
            const lower = text.toLowerCase();
            let reply = "";

            if (lower.startsWith("pon ") || lower.startsWith("reproduce ") || lower.includes("escuchar ")) {
                const songQuery = text.replace(/pon|reproduce|escuchar|canción|cancion/gi, "").trim();
                reply = songQuery ? `Buscando ${songQuery} en Spotify...` : "Abriendo Spotify...";
                setTimeout(() => window.location.href = songQuery ? `spotify:search:${encodeURIComponent(songQuery)}` : "spotify://", 1200);
                responseTextEl.innerText = reply;
                speak(reply);
            }
            else if (lower.includes("tiempo") || lower.includes("clima") || lower.includes("temperatura")) {
                reply = await getClima();
                responseTextEl.innerText = reply;
                speak(reply);
            }
            else if (lower.includes("whatsapp")) {
                reply = "Abriendo WhatsApp...";
                window.location.href = "whatsapp://";
                responseTextEl.innerText = reply;
                speak(reply);
            }
            else if (lower.includes("youtube")) {
                reply = "Abriendo YouTube...";
                window.location.href = "youtube://";
                responseTextEl.innerText = reply;
                speak(reply);
            }
            else {
                // Consulta al Motor Hiper-IA
                setThinkingVisuals();
                responseTextEl.innerText = "Calculando respuesta con la red neuronal...";
                reply = await consultarHiperIA(text);
                resetVisuals();
                speak(reply);
            }
        }

        // Conexión a la IA de alta potencia
        async function consultarHiperIA(promptUsuario) {
            try {
                const systemPrompt = "Eres J.A.R.V.I.S., la inteligencia artificial hiper-inteligente de Tony Stark. Responde a la pregunta del usuario con máxima precisión, inteligencia, brevedad y elegancia (máximo 2 o 3 frases). Dirígete al usuario siempre como 'Señor'.";
                
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "meta-llama/llama-3.3-70b-instruct:free",
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: promptUsuario }
                        ]
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.choices && data.choices[0] && data.choices[0].message) {
                        const answer = data.choices[0].message.content.trim();
                        responseTextEl.innerText = answer;
                        return answer;
                    }
                }
            } catch (e) {
                console.log("Error al conectar con el servidor primario de IA, usando respaldo...", e);
            }

            // Servidor de respaldo si falla el primario
            try {
                const fallbackUrl = `https://text.pollinations.ai/${encodeURIComponent(promptUsuario)}?system=${encodeURIComponent("Eres JARVIS. Responde de forma muy concisa, inteligente y educada en español tratando al usuario como Señor.")}`;
                const res = await fetch(fallbackUrl);
                if (res.ok) {
                    const fallbackAnswer = await res.text();
                    responseTextEl.innerText = fallbackAnswer.trim();
                    return fallbackAnswer.trim();
                }
            } catch (err) {}

            const errorText = "Señor, he experimentado una anomalía en las comunicaciones externas. Por favor, reintente en unos segundos.";
            responseTextEl.innerText = errorText;
            return errorText;
        }

        // Obtener Clima
        function getClima() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) return resolve("No tengo acceso a la ubicación de tu dispositivo.");
                navigator.geolocation.getCurrentPosition(async (position) => {
                    try {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                        const data = await res.json();
                        const temp = Math.round(data.current_weather.temperature);
                        resolve(`La temperatura actual en su posición es de ${temp} grados centígrados, Señor.`);
                    } catch (e) {
                        resolve("No pude obtener los datos meteorológicos en este momento.");
                    }
                }, () => resolve("Se requieren permisos de ubicación para consultar el clima."));
            });
        }

        // Sintetizador de voz
        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-ES';
            utterance.pitch = 0.85;

            utterance.onstart = () => {
                statusEl.innerText = "HABLANDO...";
                statusEl.style.color = "#ffaa00";
                rotationSpeed = 0.012;
            };

            utterance.onend = () => resetVisuals();
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
