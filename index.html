<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Core 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #03050a;
            color: #ffaa00;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 170, 0, 0.3);
            padding-bottom: 10px;
            z-index: 10;
        }

        .title {
            font-size: 1rem;
            letter-spacing: 3px;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 170, 0, 0.8);
        }

        .status {
            font-size: 0.85rem;
            color: #ffaa00;
            letter-spacing: 1px;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-container {
            z-index: 10;
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 10px;
        }

        .console {
            background: rgba(8, 5, 2, 0.8);
            border: 1px solid rgba(255, 170, 0, 0.4);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.15);
        }

        .response {
            font-size: 1rem;
            color: #ffe4b3;
            text-shadow: 0 0 8px rgba(255, 170, 0, 0.6);
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            background: rgba(15, 10, 3, 0.85);
            border: 1px solid rgba(255, 170, 0, 0.5);
            padding: 12px;
            border-radius: 6px;
            color: #ffaa00;
            outline: none;
            font-size: 1rem;
        }

        input:focus {
            border-color: #ffaa00;
            box-shadow: 0 0 12px rgba(255, 170, 0, 0.4);
        }

        button {
            background: rgba(255, 170, 0, 0.2);
            border: 1px solid #ffaa00;
            color: #ffaa00;
            padding: 12px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        button:hover {
            background: #ffaa00;
            color: #03050a;
            box-shadow: 0 0 15px #ffaa00;
        }

        .mic-btn {
            background: rgba(255, 80, 0, 0.25);
            border-color: #ff5500;
            color: #ffaa00;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <header>
        <div class="title">J.A.R.V.I.S. // HOLOGRAM_CORE</div>
        <div class="status" id="status">SISTEMA CONECTADO</div>
    </header>

    <div id="canvas-container"></div>

    <div class="ui-container">
        <div class="console">
            <div class="response" id="responseText">Sistemas actualizados. Toca 'HABLAR' o escribe tu orden.</div>
        </div>
        <div class="controls">
            <button class="mic-btn" onclick="startListening()">🎤 HABLAR</button>
            <input type="text" id="userInput" placeholder="Escribir comando..." onkeypress="checkEnter(event)">
            <button onclick="sendCommand()">ENVIAR</button>
        </div>
    </div>

    <script>
        // --- Motor de Audio (Efectos de Sonido Sintetizados) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playBeep(freq = 800, type = 'sine', duration = 0.1) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playJarvisSound() {
            playBeep(600, 'sine', 0.08);
            setTimeout(() => playBeep(900, 'sine', 0.12), 90);
        }

        // --- Escena 3D ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const coreGroup = new THREE.Group();
        scene.add(coreGroup);

        const innerGeo = new THREE.IcosahedronGeometry(2, 3);
        const innerMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, wireframe: true, transparent: true, opacity: 0.45 });
        const innerSphere = new THREE.Mesh(innerGeo, innerMat);
        coreGroup.add(innerSphere);

        const outerGeo = new THREE.IcosahedronGeometry(2.8, 2);
        const outerMat = new THREE.MeshBasicMaterial({ color: 0xff6600, wireframe: true, transparent: true, opacity: 0.25 });
        const outerSphere = new THREE.Mesh(outerGeo, outerMat);
        coreGroup.add(outerSphere);

        const particleCount = 2500;
        const particleGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount; i++) {
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const r = 2.0 + (Math.random() * 1.2);

            positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
            positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
            positions[i * 3 + 2] = r * Math.cos(phi);
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particleMat = new THREE.PointsMaterial({ color: 0xffc800, size: 0.045, transparent: true, opacity: 0.8 });
        const particles = new THREE.Points(particleGeo, particleMat);
        coreGroup.add(particles);

        const ringGeo = new THREE.TorusGeometry(3.3, 0.012, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.6 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 3;
        coreGroup.add(ring);

        camera.position.z = 6.5;

        function animate() {
            requestAnimationFrame(animate);
            innerSphere.rotation.y += 0.006;
            innerSphere.rotation.x += 0.003;
            outerSphere.rotation.y -= 0.004;
            particles.rotation.y += 0.002;
            ring.rotation.z += 0.008;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Reconocimiento y Lógica ---
        const statusEl = document.getElementById('status');
        const responseTextEl = document.getElementById('responseText');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';

            recognition.onstart = () => {
                playJarvisSound();
                statusEl.innerText = "ESCUCHANDO...";
                innerMat.color.setHex(0xff2200);
                particleMat.color.setHex(0xff3300);
            };

            recognition.onresult = (e) => {
                processCommand(e.results[0][0].transcript);
            };

            recognition.onerror = () => {
                statusEl.innerText = "ENTRADA DE TEXTO ACTIVA";
                responseTextEl.innerText = "Escribe tu comando en el campo inferior.";
                resetColors();
            };

            recognition.onend = () => {
                resetColors();
            };
        }

        function resetColors() {
            if (statusEl.innerText === "ESCUCHANDO...") statusEl.innerText = "SISTEMA CONECTADO";
            innerMat.color.setHex(0xffaa00);
            particleMat.color.setHex(0xffc800);
        }

        function startListening() {
            window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));
            if (recognition) {
                try {
                    recognition.start();
                } catch (err) {
                    recognition.stop();
                }
            } else {
                responseTextEl.innerText = "Modo de texto activo. Escribe tu comando.";
            }
        }

        function checkEnter(e) {
            if (e.key === 'Enter') sendCommand();
        }

        function sendCommand() {
            const input = document.getElementById('userInput');
            if (input.value.trim() !== '') {
                playBeep(1000, 'sine', 0.05);
                processCommand(input.value);
                input.value = '';
            }
        }

        // --- Procesamiento de Comandos Integrados ---
        async function processCommand(text) {
            statusEl.innerText = "PROCESANDO...";
            const lower = text.toLowerCase();
            let reply = "No tengo registros para esa instrucción, Señor.";

            if (lower.includes("hola") || lower.includes("saludos")) {
                reply = "A sus órdenes, Señor. Todos los sistemas están en línea.";
            } else if (lower.includes("estado") || lower.includes("sistemas")) {
                reply = "Núcleo principal al 100%. Conexión con el dispositivo estable.";
            } else if (lower.includes("hora")) {
                const now = new Date();
                reply = `Son las ${now.getHours()} horas con ${now.getMinutes()} minutos.`;
            } else if (lower.includes("tiempo") || lower.includes("clima") || lower.includes("temperatura")) {
                reply = await getClima();
            } else if (lower.includes("spotify") || lower.includes("música") || lower.includes("musica")) {
                reply = "Abriendo Spotify...";
                window.location.href = "spotify://";
            } else if (lower.includes("whatsapp") || lower.includes("mensaje")) {
                reply = "Abriendo WhatsApp...";
                window.location.href = "whatsapp://";
            } else if (lower.includes("youtube")) {
                reply = "Abriendo YouTube...";
                window.location.href = "youtube://";
            } else if (lower.includes("mapas") || lower.includes("mapa") || lower.includes("navegación")) {
                reply = "Abriendo Google Maps...";
                window.location.href = "comgooglemaps://";
            } else if (lower.includes("atajos") || lower.includes("rutina")) {
                reply = "Abriendo aplicación de Atajos de iOS...";
                window.location.href = "shortcuts://";
            } else if (lower.includes("llamar") || lower.includes("teléfono") || lower.includes("telefono")) {
                reply = "Abriendo marcador telefónico...";
                window.location.href = "tel:";
            } else if (lower.includes("busca") || lower.includes("buscar")) {
                const query = text.replace(/busca|buscar/gi, "").trim();
                reply = `Buscando ${query} en la red...`;
                setTimeout(() => {
                    window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
                }, 1500);
            }

            responseTextEl.innerText = reply;
            speak(reply);
        }

        // --- Consulta de Tiempo Real con API Abierta ---
        function getClima() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve("No tengo acceso a la geolocalización de tu dispositivo.");
                    return;
                }
                navigator.geolocation.getCurrentPosition(async (position) => {
                    try {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                        const data = await res.json();
                        const temp = Math.round(data.current_weather.temperature);
                        resolve(`La temperatura actual en tu ubicación es de ${temp} grados centígrados.`);
                    } catch (e) {
                        resolve("No pude obtener los datos del clima en este momento, Señor.");
                    }
                }, () => {
                    resolve("Necesito permiso de ubicación para decirte el tiempo actual.");
                });
            });
        }

        // --- Sintetizador de Voz ---
        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-ES';
            utterance.pitch = 0.85;

            utterance.onstart = () => {
                statusEl.innerText = "HABLANDO...";
            };

            utterance.onend = () => {
                statusEl.innerText = "SISTEMA CONECTADO";
            };

            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
